plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.blocker'
    compileSdk 35 // 这里的版本没问题，不用非得对齐 36

    defaultConfig {
        applicationId "com.example.blocker"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // 借鉴：确保使用 debug 签名或者你自己的签名，未签名的包 LSPosed 可能不认
            signingConfig signingConfigs.debug 
        }
    }

    plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.blocker'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.blocker"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
    compileOnly 'io.github.libxposed:api:102.0.0'
    compileOnly 'androidx.annotation:annotation:1.7.1'
}

dependencies {
    // 确保依赖版本 >= 102.0.0
    compileOnly 'io.github.libxposed:api:102.0.0' 
    compileOnly 'androidx.annotation:annotation:1.7.1'
}
